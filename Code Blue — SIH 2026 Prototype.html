<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Code Blue — Approval & Compliance Platform (SIH 2026 Prototype)</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#5b6785;--pri:#0b2a5b;--pri2:#1d4ed8;--ok:#15803d;--okb:#dcfce7;--wa:#b45309;--wab:#fef3c7;--er:#b91c1c;--erb:#fee2e2;--bd:#dbe1ee;--inf:#e0e9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#151d31;--tx:#e6ebf7;--mut:#9aa7c7;--pri:#7aa2f7;--pri2:#5b8cff;--okb:#12321f;--wab:#3a2a0a;--erb:#3b1414;--bd:#2a3553;--inf:#1c2a52;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#151d31;--tx:#e6ebf7;--mut:#9aa7c7;--pri:#7aa2f7;--pri2:#5b8cff;--okb:#12321f;--wab:#3a2a0a;--erb:#3b1414;--bd:#2a3553;--inf:#1c2a52;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#0b2a5b;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:18px}header .tag{font-size:11px;background:#ffffff26;padding:2px 8px;border-radius:99px}
.sp{flex:1}.wrap{display:flex;min-height:calc(100vh - 56px)}
nav{width:210px;background:var(--card);border-right:1px solid var(--bd);padding:12px;flex-shrink:0}
nav a{display:block;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--tx);margin-bottom:2px}nav a:hover{background:var(--inf)}nav a.on{background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav a.on{color:#0d1424}}
main{flex:1;padding:22px;min-width:0;max-width:1100px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:18px 0 8px}p.s{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi b{font-size:26px;display:block;color:var(--pri)}.kpi span{color:var(--mut);font-size:13px}
.btn{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;margin:2px 4px 2px 0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1424}}
.btn.o{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.w{background:var(--wa);color:#fff}.btn.r{background:var(--er);color:#fff}.btn.gr{background:var(--ok);color:#fff}
.b{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.b.ok{background:var(--okb);color:var(--ok)}.b.wa{background:var(--wab);color:var(--wa)}.b.er{background:var(--erb);color:var(--er)}.b.in{background:var(--inf);color:var(--pri)}
.steps{display:flex;gap:4px;flex-wrap:wrap}.steps div{flex:1;min-width:110px;padding:8px;border-radius:6px;background:var(--inf);font-size:12px;text-align:center}.steps .d{background:var(--okb);color:var(--ok);font-weight:600}.steps .c{background:var(--pri);color:#fff}
.bar{height:8px;background:var(--inf);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri2)}.bar.ok i{background:var(--ok)}.bar.wa i{background:var(--wa)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:600}
.tbl{overflow-x:auto}label{font-size:13px;color:var(--mut);display:block}select,input,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}
.note{background:var(--wab);color:var(--wa);border-radius:6px;padding:8px 10px;font-size:13px;margin:8px 0}.note.i{background:var(--inf);color:var(--pri)}
.re{font-size:11px;color:var(--pri);background:var(--inf);padding:2px 8px;border-radius:4px;font-weight:600}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:14px}.tl div{margin-bottom:8px;position:relative}.tl div:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bd)}.tl .d:before{background:var(--ok)}.tl .c:before{background:var(--wa)}
#demo{position:sticky;top:0;z-index:20;background:var(--pri2);color:#fff;padding:8px 20px;display:none;align-items:center;gap:10px;flex-wrap:wrap}#demo .btn{background:#fff;color:#0b2a5b}
#ai{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
#aib{background:var(--pri);color:#fff;border:0;border-radius:99px;padding:11px 18px;cursor:pointer;font:inherit;box-shadow:0 4px 14px #0004}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #aib{color:#0d1424}}
#aip{display:none;width:330px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;box-shadow:0 6px 24px #0005;padding:12px;max-height:70vh;overflow:auto}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}.ov .card{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.lg{max-width:760px;margin:40px auto;padding:0 16px}.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.arch div.x{background:var(--inf);border:1px solid var(--bd);border-radius:8px;padding:8px;text-align:center;margin:4px auto;max-width:520px}.arch .ar{text-align:center;color:var(--mut)}
@media(max-width:760px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap}.two{grid-template-columns:1fr}}
</style></head><body>
<header><b>🛡 Code Blue</b><span class="tag">Intelligent Approval &amp; Compliance Layer</span><span class="tag">Prototype / Demo Data</span><span class="sp"></span><span id="who" style="font-size:13px"></span><button class="btn o" style="color:#fff;border-color:#fff" onclick="go('login')" id="lo" hidden>Switch account</button></header>
<div id="demo"></div><div id="app"></div>
<div id="ai"><div id="aip"></div><button id="aib" onclick="tgAI()">💬 Regulatory Assistant</button></div>
<div id="ovl"></div>
<script>
const A=[
{n:'Pollution Consent',d:'Pollution Control Board',sla:15,rem:8,id:'REG-PB-FM-001',w:'Manufacturing activity in food processing with effluent/emissions in Punjab',docs:['PAN','GST Certificate','Land Ownership/Lease Document','Factory Layout','Environmental Declaration']},
{n:'Factory Approval',d:'Factories Department',sla:20,rem:14,id:'REG-PB-FM-002',w:'Manufacturing premises with 40 workers (above the demo threshold for factory licensing)',docs:['PAN','Factory Layout','Land Ownership/Lease Document','Business Registration']},
{n:'Fire Safety Approval',d:'Fire Department',sla:10,rem:2,id:'REG-PB-FM-003',w:'Industrial premises with storage and processing equipment',docs:['Factory Layout','Land Ownership/Lease Document','Identity Proof']},
{n:'Labour Registration',d:'Labour Department',sla:7,rem:0,id:'REG-PB-FM-004',w:'Employer with 40 employees (demo threshold: 20+)',docs:['PAN','Business Registration','Identity Proof']},
{n:'Local Authority Approval',d:'Municipal / Industrial Area Authority',sla:12,rem:9,id:'REG-PB-FM-005',w:'Industrial land use within local jurisdiction',docs:['Land Ownership/Lease Document','Business Registration','GST Certificate']}];
const SCH=[['Demo: MSME Credit Support Scheme','MSME manufacturing unit, investment up to ₹50 Cr','Collateral-free credit guarantee (illustrative)','PAN, GST, Udyam, Project report'],['Demo: Food Processing Capital Subsidy','Registered food processing unit','Capital subsidy on plant & machinery (illustrative)','Project report, Invoices, Land docs'],['Demo: State Industrial Incentive','New industrial unit in Punjab','Power tariff / SGST incentive (illustrative)','Registration, Investment proof']];
const DOCS=['PAN','GST Certificate','Land Ownership/Lease Document','Factory Layout','Business Registration','Identity Proof','Environmental Declaration'];
let S={view:'login',portal:'ent',rd:false,fixed:false,upl:false,sub:false,gov:'none',log:[],ds:-1,t:632,ai:false};
const T=()=>{let m=S.t;S.t+=17+(m%13);let h=Math.floor(m/60),mm=m%60;return (h>12?h-12:h)+':'+String(mm).padStart(2,'0')+(h>=12?' PM':' AM')};
const lg=(u,a,d)=>S.log.push([T(),u,a,d]);
const bd=(c,t)=>`<span class="b ${c}">${t}</span>`;
const RE='<span class="re">Determined by Regulatory Rule Engine</span>';
const SIM='<div class="note i">Prototype Integration / Simulated Government Workflow — no live government system is connected.</div>';
const ent=[['dash','Dashboard'],['discover','Find My Approvals'],['intel','Regulatory Intelligence'],['check','My Approval Checklist'],['valid','Document Validation'],['apps','My Applications'],['sla','SLA Monitor'],['comp','Compliance Tracker'],['sch','Government Schemes'],['sec','Security & Trust'],['arch','Architecture']];
const gov=[['gdash','Officer Dashboard'],['gapp','Open Application'],['audit','Audit Trail'],['ana','Governance Analytics'],['sec','Security & Trust'],['arch','Architecture']];
function go(v){S.view=v;render();scrollTo(0,0)}
function setP(p){S.portal=p;go(p=='ent'?'dash':'gdash')}
function login(p){S.portal=p;go(p=='ent'?'dash':'gdash')}
function render(){
 let a=document.getElementById('app'),v=S.view;
 document.getElementById('who').textContent=v=='login'?'':(S.portal=='ent'?'Rajiv Sharma · Entrepreneur':'Dept Officer · Pollution Control Board');
 document.getElementById('lo').hidden=v=='login';
 if(v=='login'){a.innerHTML=`<div class="lg"><h1>Code Blue</h1><p class="s">Intelligent Industrial Approval &amp; Compliance Platform · SIH 2026 · PS 26130</p>
 <div class="two"><div class="card"><b>Who</b><br>Entrepreneurs + Government Departments</div><div class="card"><b>Problem</b><br>Fragmented approvals &amp; compliance</div><div class="card"><b>Solution</b><br>Regulatory intelligence + workflow orchestration</div><div class="card"><b>Innovation</b><br>Deterministic rules + grounded AI + document pre-validation + cross-department SLA workflow</div></div>
 <div class="note i">Code Blue does not replace government rules or portals. It makes them understandable, actionable, traceable and easier to execute — working alongside existing systems.</div>
 <div class="two"><div class="card"><h2 style="margin-top:0">Entrepreneur Login</h2><label>Demo account</label><input value="rajiv.sharma@demo.in" readonly><br><br><button class="btn" onclick="login('ent')">Login as Entrepreneur</button></div>
 <div class="card"><h2 style="margin-top:0">Government Officer Login</h2><label>Demo account</label><input value="officer.ppcb@demo.gov" readonly><br><br><button class="btn o" onclick="login('gov')">Login as Officer</button></div></div>
 <button class="btn gr" style="font-size:17px;padding:12px 26px" onclick="startDemo()">▶ Start Demo</button>${SIM}</div>`;return}
 let nv=(S.portal=='ent'?ent:gov).map(x=>`<a class="${v==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</a>`).join('');
 nv+=`<a onclick="setP('${S.portal=='ent'?'gov':'ent'}')" style="border-top:1px solid var(--bd);margin-top:8px">⇄ Switch to ${S.portal=='ent'?'Government':'Entrepreneur'} Portal</a>`;
 a.innerHTML=`<div class="wrap"><nav>${nv}</nav><main>${V[v]()}</main></div>`;demoBar()}
const prof=()=>`<div class="card"><b>ABC Food Processing Pvt. Ltd.</b> ${bd('in','Demo Data')}<br><span style="color:var(--mut)">Punjab · Food Manufacturing · ₹5 Crore investment · 40 employees · Industrial land</span></div>`;
function pol(){return S.gov=='none'?(S.sub?0:-1):S.gov=='ver'?1:S.gov=='q'?2:S.gov=='resp'?1:3}
const chk=()=>{let miss=S.fixed?0:1;return Math.round((7-miss)/7*100)-(S.fixed?0:0)}
const V={
dash(){let s=S.sub;return `<h1>Welcome, Rajiv Sharma</h1><p class="s">Entrepreneur dashboard</p>${prof()}
${S.gov=='q'?`<div class="card" style="border-color:var(--er)">${bd('er','NEW QUERY')} from Pollution Control Board — <a href="#" onclick="go('apps');return false">Respond</a></div>`:''}
<div class="g"><div class="card kpi"><b>${s?3:0}</b><span>Active Applications</span></div><div class="card kpi"><b>${S.gov=='q'?1:S.fixed?0:1}</b><span>Pending Actions</span></div><div class="card kpi"><b>${S.gov=='ok'?2:1}</b><span>Approvals Completed</span></div><div class="card kpi"><b>${S.gov=='ok'?2:1}</b><span>Compliance Due</span></div><div class="card kpi"><b>1</b><span>SLA Alerts</span></div></div>
<h2>Your Approval Journey</h2><div class="card"><div class="steps">${['Business Profile','Approval Discovery','Documents','Submission','Department Verification','Approval'].map((x,i)=>{let d=[1,S.rd,S.fixed,S.sub,S.gov=='ok',S.gov=='ok'][i],c=!d&&(i==0||[1,S.rd,S.fixed,S.sub,S.gov=='ok'][i-1]);return `<div class="${d?'d':c?'c':''}">${d?'✓ ':''}${x}</div>`}).join('')}</div></div>
<button class="btn" onclick="go('discover')">Find My Approvals</button><button class="btn o" onclick="go('check')">Open Checklist</button>`},
discover(){return `<h1>Find My Approvals</h1><p class="s">Enter your business profile. Approvals are determined by the versioned Regulatory Rule Engine.</p>
<div class="card"><div class="two">${[['Business Type','Private Limited'],['Industry','Food Processing'],['State','Punjab'],['District','Ludhiana'],['Investment Range','₹5 Crore'],['Number of Employees','40'],['Land Type','Industrial'],['Environmental Category','Orange (demo)']].map(x=>`<div><label>${x[0]}</label><input value="${x[1]}"></div>`).join('')}</div><br><button class="btn" onclick="runDisc()">Analyze &amp; Generate Roadmap</button></div><div id="dr">${S.rd?road():''}</div>`},
intel(){return `<h1>Regulatory Intelligence</h1><p class="s">How the rule engine turns a profile into requirements — deterministic, versioned, explainable.</p>
<div class="card arch"><div class="x">Business Profile</div><div class="ar">↓</div><div class="x">Rule Matching (deterministic conditions)</div><div class="ar">↓</div><div class="x">Applicable Regulation</div><div class="ar">↓</div><div class="x">Approval Requirement</div><div class="ar">↓</div><div class="x">Document Requirement</div></div>
<div class="note i">AI never decides applicability. Same profile + same rule version = same result, every time.</div>
<div class="card tbl"><table><tr><th>Rule ID</th><th>Requirement</th><th>Version</th><th></th></tr>${A.map((a,i)=>`<tr><td>${a.id}</td><td>${a.n}</td><td>v1.2</td><td><button class="btn o" onclick="why(${i})">Why is this required?</button></td></tr>`).join('')}</table></div>`},
check(){let p=chk();return `<h1>My Approval Checklist</h1><p class="s">Personalised from your roadmap ${RE}</p><div class="card"><b>Progress: ${p}%</b><div class="bar ${p==100?'ok':''}"><i style="width:${p}%"></i></div></div>
${A.map((a,i)=>`<div class="card"><b>${a.n}</b> <span style="color:var(--mut)">· ${a.d}</span><div style="margin:8px 0">${a.docs.map(d=>{let m=d=='Environmental Declaration'&&!S.fixed;return `<div>${m?'⚠':'✓'} ${d}${m?' — '+bd('wa','Missing'):''}</div>`}).join('')}</div><button class="btn" onclick="go('valid')">Upload Document</button><button class="btn o" onclick="why(${i})">View Requirement</button><button class="btn o" onclick="tgAI(1)">Ask AI Assistant</button></div>`).join('')}`},
valid(){return `<h1>Document Validation</h1><p class="s">${bd('in','Pre-submission validation')} — not government-certified verification.</p>
<div class="card" style="border:2px dashed var(--bd);text-align:center;padding:26px">Drag &amp; drop a file here (simulated)<br><br><button class="btn" onclick="upl()">Upload factory_layout.pdf</button></div>
${S.upl?`<div class="card"><b>factory_layout.pdf — Validation Result</b><div style="margin:8px 0">✓ Correct document type<br>✓ File readable<br>✓ Required fields detected<br>✓ Business name matches<br>✓ Document not expired<br>${S.fixed?'✓ Plot Number present (corrected)':'⚠ Missing required field: <b>Plot Number</b>'}</div>${S.fixed?bd('ok','Ready for submission'):bd('wa','Needs Correction Before Submission')}<br><br>${S.fixed?'':`<button class="btn" onclick="fix()">Fix Document</button><button class="btn o" onclick="this.nextElementSibling.style.display='block'">Submit Anyway</button><div style="display:none" class="note">⚠ Submitting with a known issue may lead to a query or rejection by the department.</div>`}</div>`:''}
<button class="btn ${S.sub?'o':'gr'}" onclick="submit()" ${S.sub?'disabled':''}>${S.sub?'Application Submitted':'Submit Application'}</button>${SIM}`},
apps(){let p=pol(),tl=(l,st)=>`<div class="${st}">${l}</div>`;
 let pl=['Submitted','Under Verification','Query Raised','Approved'].map((l,i)=>{let st=!S.sub?'':(i<=p?'d':(i==p+1?'c':''));if(i==2&&S.gov!='q'&&S.gov!='resp'&&S.gov!='ok')st='';if(i==2&&(S.gov=='resp'||S.gov=='ok'))st='d';return tl(l,st)}).join('');
 return `<h1>My Applications</h1><p class="s">APP-2026-001 · Food Processing Unit</p>
${!S.sub?'<div class="note">No applications submitted yet. Complete the checklist and submit.</div>':''}
${S.gov=='q'?`<div class="card" style="border-color:var(--er)">${bd('er','NEW QUERY')}<br><b>Department:</b> Pollution Control<br><b>Message:</b> Please upload the updated factory layout containing the plot number.<br><br><button class="btn" onclick="respond()">Upload Response</button></div>`:''}
${S.sub?`<div class="g"><div class="card"><b>Pollution Consent</b> ${S.gov=='ok'?bd('ok','Approved'):bd('in','In progress')}<div class="tl" style="margin-top:8px">${pl}</div></div>
<div class="card"><b>Fire Approval</b> ${bd('ok','Approved')}<div class="tl" style="margin-top:8px"><div class="d">Submitted</div><div class="d">Verified</div><div class="d">Approved</div></div></div>
<div class="card"><b>Factory Approval</b> ${bd('in','Under Review')}<div class="tl" style="margin-top:8px"><div class="d">Submitted</div><div class="c">Under Review</div></div></div></div>`:''}`},
sla(){let x=[['Pollution Control Board',15,S.gov=='ok'?0:8,S.gov=='ok'?'Completed':'On Track'],['Fire Department',10,2,'Attention Required'],['Labour Department',7,0,'Completed']];
 return `<h1>SLA Monitor</h1><p class="s">Countdown per department ${bd('in','Demo Data')}</p><div class="g">${x.map(a=>{let c=a[3]=='Completed'?'ok':a[3]=='On Track'?'':'wa',u=a[3]=='Completed'?100:Math.round((a[1]-a[2])/a[1]*100);return `<div class="card"><b>${a[0]}</b><br>${bd(c||'in',a[3])}<div style="margin:10px 0" class="bar ${c}"><i style="width:${u}%"></i></div>SLA: ${a[1]} days<br>Remaining: ${a[3]=='Completed'?'—':a[2]+' days'}</div>`}).join('')}</div>`},
comp(){let ok=S.gov=='ok';return `<h1>Compliance &amp; Renewal Tracker</h1><p class="s">Updates after approval</p>${ok?'<div class="note i">Pollution Consent approved — renewal and periodic returns now tracked.</div>':'<div class="note">Tracking begins after first approval.</div>'}<div class="card tbl"><table><tr><th>Item</th><th>Due</th><th>Status</th></tr><tr><td>Labour Registration renewal</td><td>Demo: 12 Mar 2027</td><td>${bd('ok','Scheduled')}</td></tr><tr><td>Fire NOC renewal</td><td>Demo: 30 Sep 2027</td><td>${bd('ok','Scheduled')}</td></tr>${ok?`<tr><td>Pollution Consent — annual return</td><td>Demo: 30 Jun 2027</td><td>${bd('wa','Due soon')}</td></tr><tr><td>Pollution Consent — renewal</td><td>Demo: 29 Sep 2029</td><td>${bd('ok','Scheduled')}</td></tr>`:''}</table></div>`},
sch(){return `<h1>Government Schemes</h1><p class="s">Matched to your profile ${bd('in','Demo / reference data — verify before applying')}</p>${SCH.map(s=>`<div class="card"><b>${s[0]}</b><br><b>Eligibility:</b> ${s[1]}<br><b>Benefits:</b> ${s[2]}<br><b>Documents:</b> ${s[3]}<br><b>Official Source:</b> <i>Link to be verified with official department portal</i></div>`).join('')}`},
sec(){let r=[['RBAC','Entrepreneur / Officer / Admin roles'],['Encryption','In transit (TLS) and at rest'],['Audit Logs','Every action recorded, immutable'],['Versioned Regulations','Rules carry ID, version, effective date'],['Secure Document Storage','Access-controlled object storage'],['Grounded AI','Answers cite verified rules only'],['Role Separation','Officers cannot edit applicant data']];
 return `<h1>Security &amp; Trust</h1><div class="two"><div class="card"><b>AI ≠ Regulatory Authority</b><br>AI explains; it never decides.</div><div class="card"><b>Rule Engine = Source of Truth</b><br>Deterministic and versioned.</div></div><div class="g">${r.map(x=>`<div class="card"><b>✓ ${x[0]}</b><br><span style="color:var(--mut)">${x[1]}</span></div>`).join('')}</div><div class="note">Design targets for the prototype; not a security certification.</div>`},
arch(){let x=(t,s)=>`<div class="x">${t}${s?`<br><small>${s}</small>`:''}</div>`,ar='<div class="ar">↓</div>';
 return `<h1>Technology Architecture</h1><div class="card arch">${x('Entrepreneur Portal','React')}${ar}${x('API / Backend','Spring Boot REST')}${ar}<div class="x"><b>Regulatory Orchestration Layer</b><div class="two" style="margin-top:6px"><div class="x">Regulatory Rule Engine</div><div class="x">Workflow Engine</div><div class="x">Document Validation</div><div class="x">SLA Engine</div><div class="x" style="grid-column:1/-1">Grounded AI Assistant (LLM)</div></div></div>${ar}${x('Data','PostgreSQL · Redis cache · Cloud object storage')}${ar}${x('Government Portal')}${ar}${x('Department Workflows','Prototype Integration / Simulated')}</div>${SIM}`},
gdash(){let q=S.gov=='q',n=S.sub?1:0;return `<h1>Department Officer Dashboard</h1><p class="s">Pollution Control Board</p>${SIM}<div class="g">${[['Applications Received',n+(S.sub?11:9)],['Pending Verification',S.gov=='none'&&S.sub?1:0],['Queries',q?1:0],['SLA Breaches',0],['Approved',S.gov=='ok'?15:14],['Rejected',2]].map(x=>`<div class="card kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
<div class="card tbl"><table><tr><th>ID</th><th>Applicant</th><th>Department</th><th>Status</th><th></th></tr>${S.sub?`<tr><td>APP-2026-001</td><td>ABC Food Processing Pvt Ltd</td><td>Pollution Control</td><td>${gst()}</td><td><button class="btn" onclick="go('gapp')">Open Application</button></td></tr>`:'<tr><td colspan=5>No new applications. (Demo data)</td></tr>'}</table></div>`},
gapp(){if(!S.sub)return '<h1>Application</h1><div class="note">No application submitted yet.</div>';let g=S.gov;
 return `<h1>APP-2026-001 · Pollution Consent</h1><p class="s">${gst()} · SLA ${g=='ok'?'Completed':'8 days remaining'}</p>
<div class="two"><div class="card"><b>Applicant</b><br>Rajiv Sharma, ABC Food Processing Pvt. Ltd.<br><b>Profile:</b> Punjab · Food Mfg · ₹5 Cr · 40 emp</div><div class="card"><b>Regulatory Requirement</b><br>REG-PB-FM-001 v1.2 ${RE}</div></div>
<div class="card"><b>Documents &amp; Validation Results</b><br>✓ PAN · ✓ GST · ✓ Land Lease · ✓ Environmental Declaration<br>${g=='resp'||g=='ok'?'✓ Factory layout (updated, plot number present)':'⚠ factory_layout.pdf — pre-validation flagged plot number'} ${bd('in','Pre-submission validation')}</div>
${g=='resp'?`<div class="note i"><b>Response Submitted</b> — applicant uploaded the updated factory layout.</div>`:''}
<div class="card"><b>Actions</b><br><button class="btn" onclick="verify()" ${g!='none'&&g!='resp'?'disabled':''}>Verify</button><button class="btn w" onclick="rq()" ${g!='ver'?'disabled':''}>Raise Query</button><button class="btn gr" onclick="approve()" ${g!='ver'&&g!='resp'?'disabled':''}>Approve</button><button class="btn r" onclick="alert('Prototype: rejection requires a reason and is logged.')">Reject</button></div>
<h2>Audit Log</h2>${aud()}`},
audit(){return `<h1>Audit Trail</h1><p class="s">Every action is traceable</p>${aud()}`},
ana(){let d=[['Pollution',42],['Factory',35],['Fire',28],['Labour',22],['Local Auth.',30]],st=[['Approved',52],['In review',28],['Query',12],['Rejected',8]],sl=[['Jan',88],['Feb',90],['Mar',86],['Apr',92],['May',94]];
 let bars=(a)=>a.map(x=>`<div style="display:flex;gap:8px;align-items:center;margin:5px 0"><span style="width:90px;font-size:13px">${x[0]}</span><div class="bar" style="flex:1"><i style="width:${Math.min(100,x[1]*(x[1]>60?1:2))}%"></i></div><span style="width:32px;font-size:13px">${x[1]}</span></div>`).join('');
 return `<h1>Governance Analytics</h1><p class="s">${bd('wa','Prototype / Demo Data — not real-world statistics')}</p><div class="g">${[['Avg Processing Time','11.2 days'],['SLA Compliance','92%'],['Pending Applications','24'],['Query Rate','18%'],['Approval Rate','81%']].map(x=>`<div class="card kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
<div class="g"><div class="card"><b>Applications by Department</b>${bars(d)}</div><div class="card"><b>Applications by Status (%)</b>${bars(st)}</div><div class="card"><b>SLA Performance (%)</b>${bars(sl)}</div></div>`}};
const gst=()=>({none:bd('wa','Pending Verification'),ver:bd('in','Verified'),q:bd('er','Query Raised'),resp:bd('in','Response Submitted'),ok:bd('ok','Approved')}[S.gov]);
const aud=()=>`<div class="card tbl"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Department</th></tr>${S.log.length?S.log.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td></tr>`).join(''):'<tr><td colspan=4>No events yet (demo)</td></tr>'}</table></div>`;
function road(){return `<h2>Your Regulatory Roadmap</h2><div class="note i"><b>5 Applicable Approvals</b> · Rule set v1.2 · ${RE}</div>${A.map((a,i)=>`<div class="card"><b>${i+1}. ${a.n}</b> ${bd('er','Required')} ${RE}<br><b>Why it applies:</b> ${a.w}<br><b>Documents:</b> ${a.docs.join(', ')}<br><b>Department:</b> ${a.d} · <b>Est. SLA:</b> ${a.sla} days · <b>Status:</b> ${S.sub?'Submitted':'Not started'}<br><button class="btn o" onclick="why(${i})">Why is this required?</button></div>`).join('')}<button class="btn" onclick="go('check')">Continue to Checklist</button>`}
function runDisc(){let d=document.getElementById('dr'),m=['Analyzing business profile...','Checking applicable regulatory rules...','Matching jurisdiction...','Generating approval roadmap...'],i=0;d.innerHTML='<div class="card" id="pm"></div>';let t=setInterval(()=>{if(i<m.length){document.getElementById('pm').innerHTML=m.slice(0,i+1).map((x,j)=>(j<i?'✓ ':'⏳ ')+x).join('<br>');i++}else{clearInterval(t);S.rd=true;d.innerHTML=road()}},550)}
function why(i){let a=A[i];document.getElementById('ovl').innerHTML=`<div class="ov" onclick="if(event.target==this)this.remove()"><div class="card"><b>Why is ${a.n} required?</b> ${RE}<table><tr><td>Rule ID</td><td>${a.id}</td></tr><tr><td>Jurisdiction</td><td>Punjab</td></tr><tr><td>Industry</td><td>Food Manufacturing</td></tr><tr><td>Condition</td><td>${a.w}</td></tr><tr><td>Requirement</td><td>${a.n}</td></tr><tr><td>Source</td><td>Authorised Regulatory Source (demo reference)</td></tr><tr><td>Version</td><td>v1.2</td></tr><tr><td>Effective Date</td><td>01 Apr 2026 (demo)</td></tr></table><div class="note i">Deterministic: same inputs + same version → same result. No AI involved in this decision.</div><button class="btn" onclick="document.getElementById('ovl').innerHTML=''">Close</button></div></div>`}
function upl(){S.upl=true;lg('Rajiv Sharma','Document validation completed (factory_layout.pdf)','Code Blue');render()}
function fix(){S.fixed=true;render()}
function submit(){if(!S.upl){alert('Upload and validate a document first.');return}if(!S.fixed&&!confirm('Known issue remains. Submission may be rejected. Continue?'))return;S.sub=true;lg('Rajiv Sharma','Application submitted','Pollution Control');lg('System','Department received application','Pollution Control');render()}
function verify(){S.gov='ver';lg('Dept Officer','Document verified','Pollution Control');render()}
function rq(){S.gov='q';lg('Dept Officer','Raised query: updated factory layout with plot number','Pollution Control');render()}
function respond(){S.gov='resp';lg('Rajiv Sharma','Uploaded response (updated factory layout)','Pollution Control');render()}
function approve(){S.gov='ok';lg('Dept Officer','Application approved','Pollution Control');render()}
const Q={'What approvals do I need?':['You need 5 approvals: Pollution Consent, Factory Approval, Fire Safety, Labour Registration and Local Authority Approval, as determined by the rule engine.',0],'Why do I need Pollution Consent?':['Your profile shows food-manufacturing activity in Punjab, which matches rule REG-PB-FM-001 (v1.2).',0],'What documents are missing?':['Environmental Declaration is missing for Pollution Consent. Checklist completion is 78%.',0],'Explain this regulation in simple language.':['This rule says units that process food and release waste must get permission from the pollution board before starting operations.',0],'How do I fix this document?':['Your factory layout is missing the Plot Number. Add it, re-upload, and validate again.',3]};
function tgAI(o){let p=document.getElementById('aip');if(o){p.style.display='block'}else p.style.display=p.style.display=='block'?'none':'block';if(!p.dataset.i){p.dataset.i=1;p.innerHTML='<b>Code Blue Regulatory Assistant</b><div class="note i">Grounded assistant: explains verified rules; never invents approvals.</div><div id="ac"></div>'+Object.keys(Q).map(k=>`<button class="btn o" style="display:block;width:100%;text-align:left;margin:4px 0" onclick="ask('${k}')">${k}</button>`).join('')}}
function ask(k){let r=Q[k];document.getElementById('ac').innerHTML=`<div class="card"><b>${k}</b><br>${r[0]}<br><small style="color:var(--ok)">✓ Based on verified regulatory rules</small> · <a href="#" onclick="why(${r[1]});return false">View Source Rule</a></div>`}
const DS=[['Login as entrepreneur',()=>login('ent')],['Enter business profile',()=>go('discover')],['Generate approval roadmap',()=>{go('discover');runDisc()}],['View regulatory justification',()=>{go('discover');S.rd=true;render();why(0)}],['View personalised checklist',()=>{ovlx();go('check')}],['Upload document → pre-validation result',()=>{go('valid');upl()}],['Fix document & submit application',()=>{fix();submit()}],['Switch to Government Portal',()=>{setP('gov');go('gapp')}],['Officer verifies',verify],['Officer raises query',rq],['Entrepreneur sees query & responds',()=>{S.portal='ent';go('apps');setTimeout(respond,1200)}],['Officer approves',()=>{S.portal='gov';go('gapp');setTimeout(approve,900)}],['Entrepreneur sees approval',()=>{S.portal='ent';go('apps')}],['Compliance tracking updates',()=>go('comp')]];
const ovlx=()=>document.getElementById('ovl').innerHTML='';
function startDemo(){S={view:'login',portal:'ent',rd:false,fixed:false,upl:false,sub:false,gov:'none',log:[],ds:-1,t:632};nextDemo()}
function nextDemo(){ovlx();S.ds++;if(S.ds>=DS.length){S.ds=-1}else DS[S.ds][1]();demoBar()}
function demoBar(){let d=document.getElementById('demo');if(S.ds<0){d.style.display='none';return}d.style.display='flex';let n=S.ds+1,nx=DS[S.ds+1];d.innerHTML=`<b>Demo ${n}/${DS.length}:</b> ${DS[S.ds][0]}<span class="sp"></span>${nx?`<button class="btn" onclick="nextDemo()">Next: ${nx[0]} →</button>`:'<b>✓ Demo complete</b>'}<button class="btn" onclick="S.ds=-1;demoBar()">Exit</button>`}
render();
</script></body></html>
